[package]
name = "sagt"
# MÅSTE matcha tauri.conf.json:s `version`. Grindas av check_versions.py.
#
# Fältet stod länge på 0.0.0 med motiveringen att det "varken läses av bundlern, av CI
# eller av koden". Den motiveringen var fel, uppmätt 2026-08-19: tauri-winres använder
# CARGO_PKG_VERSION för STRÄNG-fältet FileVersion i Windows PE-resursen. En debug-binär
# från 2026-06-09, när appen var 0.9.28 och detta fält stod på 0.9.5, rapporterade:
#
#     FileVersionRaw (binär)  = 0.9.28.0   <- tauri.conf.json, via tauri-build
#     FileVersion    (sträng) = 0.9.5      <- HÄRIFRÅN
#
# Filegenskaper, supportfrågan "vilken version har du?" och SmartScreen-ryktet läser
# strängen. Att hålla fältet utanför synken gjorde alltså inte problemet ofarligt — det
# gjorde det osynligt. Rätt svar på en fil som måste vara i synk är att lägga den under
# grinden, vilket den nu är.
version = "0.10.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
crossbeam-channel = "0.5"
rubato = "0.14"
anyhow = "1.0"
hound = "3.5"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["sync"] }
num-traits = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_rusqlite = "0.35"
chrono = { version = "0.4", features = ["serde"] }

# 🔴 windows-craten är TARGET-GATAD. Låg den under [dependencies] byggde Cargo den
# även på macOS, och bygget dog i det transitiva windows-future v0.2.1 med tolv
# "cannot find ... in windows_core::imp" — INNAN vår egen kod ens nåddes. Felet såg
# ut som ett beroendeproblem och var en saknad rad här. Uppmätt 2026-08-24.
#
# Direkt windows-dep med två konsumenter. cpal drar in en egen äldre
# windows-version transitivt — olika major-versioner samexisterar i Cargo.
#
#   audio_meter.rs  WASAPI-peakmetrar     -> Media_Audio*, System_Com*, UI_Shell*,
#                                            Devices_FunctionDiscovery
#   applog.rs       filloggning på Windows -> Foundation, System_Console, System_Pipes,
#                                            Security (CreatePipe är gatad bakom den:
#                                            signaturen nämner SECURITY_ATTRIBUTES även
#                                            när vi skickar None)
#
# Featurelistan är additiv och gemensam; håll grupperna ovan uppdaterade när en ny
# konsument tillkommer, annars går det inte att veta vilken rad som får strykas.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
] }

# Systemljud på macOS (mac_sysaudio.rs). objc2 och core-foundation finns redan
# transitivt via cpal, men deklareras direkt här — en transitiv version är ingen
# garanti och kan försvinna med en cpal-uppgradering.
# dup2/pipe för filloggningen (applog.rs). Ingen stabil std-motsvarighet finns.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSValue"] }
block2 = "0.6"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[features]
devtools = ["tauri/devtools"]

